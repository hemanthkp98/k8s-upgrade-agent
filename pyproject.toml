[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "k8s-upgrade-agent"
version = "0.1.0.dev0"
description = "AI-assisted agent that plans, gates, executes, and verifies Kubernetes version upgrades."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "Hemanth K P" }
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "boto3>=1.34.0",
    "kubernetes>=29.0.0",
    "ruamel.yaml>=0.18.0",
    "jinja2>=3.1.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "moto[all]>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "syrupy>=4.6.0",
    "types-PyYAML",
    "boto3-stubs[eks,ec2,sts,logs,bedrock-runtime,cloudwatch]",
]

[project.scripts]
kua = "kua.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["kua"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["kua.core.*", "kua.rules.*", "kua.plan.*"]
strict = true

[[tool.mypy.overrides]]
module = ["kubernetes.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs kind",
    "e2e: needs real cloud",
]
